name: Bug report
description: Report a reproducible CLI, schema, or agent-context failure.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include company secrets, credentials, personal data, or confidential context packs.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and the behavior you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a sanitized fixture and the exact command when possible.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Company.md version
      placeholder: 0.2.0
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI
        - Specification or schema
        - Agent skill
        - DESIGN.md integration
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, personal data, and confidential company context.
          required: true
