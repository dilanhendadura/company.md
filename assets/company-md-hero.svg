    <rect x="418" width="174" height="54" rx="27" fill="#213244" stroke="#526273"/>
    <text x="505" y="35" text-anchor="middle" fill="#F7F8FA">OFFER.md</text>
    <rect y="68" width="172" height="54" rx="27" fill="#213244" stroke="#526273"/>
    <text x="86" y="103" text-anchor="middle" fill="#F7F8FA">VOICE.md</text>
    <rect x="186" y="68" width="186" height="54" rx="27" fill="#213244" stroke="#526273"/>
    <text x="279" y="103" text-anchor="middle" fill="#F7F8FA">DESIGN.md</text>
  </g>

  <g transform="translate(900 112)" filter="url(#shadow)">
