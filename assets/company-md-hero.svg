    <text x="48" y="70" fill="#687584" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="19" font-weight="600">$company</text>
    <text x="48" y="118" fill="#172033" font-family="Inter, IBM Plex Sans, Arial, sans-serif" font-size="31" font-weight="700">Create a sales deck for Meridian</text>
    <text x="48" y="158" fill="#172033" font-family="Inter, IBM Plex Sans, Arial, sans-serif" font-size="31" font-weight="700">using our approved design.</text>
    <path d="M48 201h474" stroke="#DCE2E7"/>

    <g font-family="Inter, IBM Plex Sans, Arial, sans-serif">
      <circle cx="68" cy="246" r="20" fill="#1F6B5C"/>
      <path d="m59 246 6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="104" y="254" fill="#172033" font-size="24" font-weight="600">Context validated</text>
      <text x="104" y="283" fill="#687584" font-size="18">Commercial + voice + visual</text>

      <circle cx="68" cy="335" r="20" fill="#1F6B5C"/>
      <path d="m59 335 6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="104" y="343" fill="#172033" font-size="24" font-weight="600">Claims checked</text>
      <text x="104" y="372" fill="#687584" font-size="18">No invented proof or pricing</text>

