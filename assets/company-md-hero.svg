    <rect x="48" y="501" width="474" height="38" rx="19" fill="#E2F0EC"/>
    <text x="285" y="526" text-anchor="middle" fill="#1F6B5C" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="17" font-weight="700">CONTEXT + SOURCE RECEIPT READY</text>
