  <text x="110" y="726" fill="#8FA0AE" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="20">OPEN SOURCE  ·  HUMAN-OWNED  ·  AGENT-READABLE  ·  CI-VALIDATED</text>
