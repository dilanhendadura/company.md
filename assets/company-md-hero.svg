  <text x="110" y="358" fill="#62B7A6" font-family="Inter, IBM Plex Sans, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="-2">Reliable AI work.</text>
  <text x="112" y="428" fill="#C6D0D9" font-family="Inter, IBM Plex Sans, Arial, sans-serif" font-size="27">One open standard for every agent that speaks for your company.</text>

  <g transform="translate(110 505)" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="22" font-weight="600">
    <rect width="190" height="54" rx="27" fill="#213244" stroke="#526273"/>
    <text x="95" y="35" text-anchor="middle" fill="#F7F8FA">COMPANY.md</text>
    <rect x="204" width="200" height="54" rx="27" fill="#213244" stroke="#526273"/>
