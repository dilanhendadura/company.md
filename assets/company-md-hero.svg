    <path d="M24 18h34l14 14v36H24z" fill="#172033"/>
    <path d="M58 18v18h14" fill="none" stroke="#62B7A6" stroke-width="6" stroke-linejoin="round"/>
    <path d="M35 45h25M35 56h18" stroke="#62B7A6" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="222" y="168" fill="#F7F8FA" font-family="Inter, IBM Plex Sans, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-3">Company.md</text>
