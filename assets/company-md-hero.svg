<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">Company.md — approved context, reliable AI work</title>
  <desc id="desc">Company, customer, offer, voice, and design files flow through a governed context layer to every AI agent.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#172F38"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#081018" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1600" height="800" rx="42" fill="url(#background)"/>
  <circle cx="1435" cy="-20" r="330" fill="#1F6B5C" opacity=".28"/>
  <circle cx="90" cy="760" r="280" fill="#1F6B5C" opacity=".12"/>

  <g transform="translate(110 104)">
